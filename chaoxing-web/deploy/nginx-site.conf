# 前后端分离后的站点配置：
#   /        -> 前端静态资源（web/ 目录，nginx 直接发）
#   /api/    -> 后端 FastAPI（仅监听 127.0.0.1:8000）
server {
    listen 80;
    server_name homework.aws.shiliu153.cn;

    # ACME HTTP-01 challenge（certbot webroot），必须保持明文可访问
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/homework.aws.shiliu153.cn;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name homework.aws.shiliu153.cn;

    ssl_certificate     /etc/letsencrypt/live/homework.aws.shiliu153.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homework.aws.shiliu153.cn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/homework.aws.shiliu153.cn/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /www/wwwlogs/homework.aws.shiliu153.cn.log;
    error_log  /www/wwwlogs/homework.aws.shiliu153.cn.error.log;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;

    # ---------- 前端（纯静态） ----------
    root /www/wwwroot/homework.aws.shiliu153.cn/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---------- 后端（只暴露 /api/） ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 15s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }
}
